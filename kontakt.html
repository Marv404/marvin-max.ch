        <a href="https://www.marvin-max.ch">
            <picture>
                <source media="(max-width: 700px)" srcset="/assets/monogram-hell-auf-dunkel.svg">
                <img src="/assets/logo.svg" alt="Marvin Schneider" class="menu-logo">
            </picture>
        </a>
    </p>
    <button class="nav-toggle" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="main-nav">
        <span class="nav-toggle-bar"></span>

        <ul class="nav-list">
                <li><a href="index.html">Home</a></li>

                <li><a class="contact-button" href="kontakt.html">Kontakt</a></li>
        </ul>
    </nav>
</header>

<main class="contact">
    <section class="contact-intro">
        <h1 class="about-title">Kontakt</h1>
        <p>
            Du hast eine Frage, ein Projekt oder einfach Lust auf einen Austausch?
            Schreib mir, ich melde mich so schnell wie möglich.
        </p>
    </section>

    <form class="contact-form" action="https://formspree.io/f/xeaezopy" method="POST">
        <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>
        </div>

        <div class="form-field">
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="form-field">
            <label for="message">Nachricht</label>
            <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <!-- Honeypot gegen Spam-Bots: für Menschen unsichtbar -->
        <input type="text" name="_gotcha" class="form-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button type="submit" class="hero-button hero-button--primary form-submit">Nachricht senden</button>
    </form>
</main>
